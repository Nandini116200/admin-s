<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tables | JFAM Admin</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body data-page="database">
  <div id="adminPageShell"></div>
  <style>
    .db-dashboard {
      display: grid;
      gap: 16px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      width: 100%;
    }

    .db-link-panel,
    .db-table-links,
    .db-toolbar,
    .db-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(87, 51, 26, 0.06);
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      padding: 18px;
    }

    .db-link-panel {
      align-items: center;
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(0, 1fr) auto;
      min-width: 0;
    }

    .db-link-panel h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      line-height: 1.15;
      margin: 0 0 5px;
    }

    .db-link-panel p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      margin: 0;
    }

    .db-link-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      min-width: 0;
    }

    .db-link-btn,
    .db-open-selected,
    .db-table-links a {
      align-items: center;
      background: #f5efe6;
      border: 1px solid rgba(87, 51, 26, 0.16);
      border-radius: 10px;
      color: var(--ink);
      display: inline-flex;
      font-size: 14px;
      font-weight: 800;
      justify-content: center;
      min-height: 42px;
      min-width: 0;
      padding: 0 14px;
      text-decoration: none;
      white-space: nowrap;
    }

    .db-link-btn.primary,
    .db-open-selected {
      background: #2f7d48;
      border-color: #2f7d48;
      color: #fff;
    }

    .db-table-links {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 100%;
      overflow: visible;
      padding-bottom: 18px;
      white-space: normal;
    }

    .db-table-wrap::-webkit-scrollbar {
      height: 10px;
    }

    .db-table-wrap::-webkit-scrollbar-track {
      background: #f2d9ce;
      border-radius: 999px;
    }

    .db-table-wrap::-webkit-scrollbar-thumb {
      background: #cf6540;
      border-radius: 999px;
    }

    .db-table-links a {
      flex: 0 1 auto;
      min-height: 36px;
      max-width: 100%;
      min-width: 0;
      padding: 0 12px;
      white-space: normal;
      word-break: break-word;
    }

    .db-toolbar {
      align-items: end;
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(190px, 0.8fr) minmax(220px, 1fr) minmax(210px, auto);
      min-width: 0;
    }

    .db-toolbar > * {
      min-width: 0;
    }

    .db-toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      min-width: 0;
    }

    .db-toolbar-actions button,
    .db-toolbar-actions .db-open-selected {
      min-height: 42px;
      width: auto;
    }

    .db-refresh-btn {
      background: #f5efe6;
      border: 1px solid rgba(87, 51, 26, 0.16);
      color: var(--ink);
      min-width: 88px;
      padding: 0 12px;
    }

    .db-toolbar-actions .db-open-selected {
      min-width: 132px;
      padding: 0 12px;
    }

    .db-toolbar label {
      color: var(--muted);
      display: grid;
      font-size: 12px;
      font-weight: 800;
      gap: 6px;
      text-transform: uppercase;
    }

    .db-status {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .db-panel-head {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 12px;
      min-width: 0;
    }

    .db-scroll-hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin: 0;
    }

    .db-status.success {
      color: #2f7d48;
      font-weight: 800;
    }

    .db-status.error {
      color: #c8483b;
      font-weight: 800;
    }

    .db-table-wrap {
      border: 1px solid rgba(80, 196, 213, 0.45);
      border-radius: 12px;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      padding-bottom: 10px;
      scrollbar-color: rgba(207, 101, 64, 0.7) #f2d9ce;
      scrollbar-width: thin;
      cursor: grab;
    }

    .db-table {
      border-collapse: collapse;
      min-width: min(var(--db-table-min-width, 1320px), 100rem);
      table-layout: fixed;
      width: max(100%, var(--db-table-min-width, 1320px));
    }

    .db-table-wrap[data-db-table="product_catalog"] {
      --db-table-min-width: 1480px;
    }

    .db-table-wrap[data-db-table="order_items"] {
      --db-table-min-width: 1560px;
    }

    .db-table-wrap[data-db-table="orders"] {
      --db-table-min-width: 1260px;
    }

    .db-table-wrap[data-db-table="profiles"] {
      --db-table-min-width: 1120px;
    }

    .db-table th,
    .db-table td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    .db-table th:last-child,
    .db-table td:last-child {
      width: 118px;
    }

    .db-table th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      text-transform: uppercase;
      white-space: normal;
      word-break: keep-all;
    }

    .db-table td {
      font-size: 13px;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .db-table input,
    .db-table select,
    .db-table textarea {
      background: #fffaf4;
      border: 1px solid rgba(80, 196, 213, 0.85);
      border-radius: 8px;
      color: var(--ink);
      font: inherit;
      min-height: 36px;
      min-width: 0;
      padding: 7px 9px;
      width: 100%;
    }

    .db-table textarea {
      min-height: 68px;
      resize: vertical;
    }

    .db-key {
      color: var(--muted);
      font-family: Consolas, monospace;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .db-actions {
      min-width: 104px;
      text-align: right;
    }

    .db-actions button {
      min-height: 36px;
      min-width: 72px;
      padding: 0 12px;
      width: auto;
    }

    .db-empty {
      color: var(--muted);
      padding: 24px;
      text-align: center;
    }

    .db-readonly {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      .db-link-panel,
      .db-toolbar {
        grid-template-columns: 1fr;
      }

      .db-link-actions {
        justify-content: flex-start;
      }

      .db-link-btn,
      .db-open-selected {
        justify-content: center;
      }

      .db-link-btn,
      .db-open-selected,
      .db-toolbar button {
        width: auto;
      }

      .db-toolbar-actions {
        justify-content: stretch;
      }

      .db-toolbar-actions button,
      .db-toolbar-actions .db-open-selected {
        flex: 1 1 130px;
      }
    }

    @media (max-width: 520px) {
      .db-link-panel,
      .db-table-links,
      .db-toolbar,
      .db-panel {
        border-radius: 12px;
        padding: 14px;
      }

      .db-link-panel h2 {
        font-size: 21px;
      }

      .db-table {
        min-width: min(var(--db-table-min-width, 1120px), 76rem);
        width: max(100%, min(var(--db-table-min-width, 1120px), 76rem));
      }

      .db-link-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .db-link-btn,
      .db-open-selected,
      .db-toolbar button {
        width: 100%;
      }

      .db-toolbar-actions {
        display: flex;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./Supabase.js"></script>
  <script src="./admin-pages.js"></script>
  <script src="./database-page.js"></script>
</body>
</html>
